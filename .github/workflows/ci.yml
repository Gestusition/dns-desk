name: Windows CLI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify without changing DNS
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Publish portable executable
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: dns-desk-win-x64
          path: |
            artifacts/publish/dns-desk.exe
            artifacts/publish/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dns-desk-win-x64
          path: artifacts/publish
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          artifacts/publish/dns-desk.exe
          artifacts/publish/SHA256SUMS.txt
          --title "DNS Desk CLI $env:GITHUB_REF_NAME"
          --notes-file docs/release-notes.md
